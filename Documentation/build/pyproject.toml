[project]
name = "taskmanager-docs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pillow>=13.0.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
# The builders hold document text, so lines are longer than in the app.
line-length = 170

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
