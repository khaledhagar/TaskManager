[project]
name = "backend"
version = "0.1.0"
description = "Task Manager API: FastAPI + SQLite Kanban backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.9.1",
    "boto3>=1.43.115",
    "fastapi[standard]>=0.149.0",
    "itsdangerous>=2.2.0",
    "litellm>=1.106.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real AI model and uses the free daily quota",
    "real_start: new accounts get the real first board (empty columns), not example cards",
]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/versions/*" = ["E501"]  # generated by Alembic

# Vercel (Phase 28): the project's Root Directory is `backend`; Vercel finds `app` in app/main.py.
# The build step makes the website into backend/frontend_dist (set FRONTEND_DIST=frontend_dist).
[tool.vercel.scripts]
build = "npm --prefix ../frontend ci && npm --prefix ../frontend run build -- --outDir ../backend/frontend_dist --emptyOutDir"
